[package]
name = "agent-sesh"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `agent-sesh`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "agent-sesh"
path = "src/main.rs"

[dependencies]
clap = "4"
version-rs = { path = "../version-rs", default-features = false }
notify-rs = { path = "../notify-rs", default-features = false }
config-rs = { path = "../config-rs", default-features = false }
registry-rs = { path = "../registry-rs", default-features = false }
serde_json = "1"
debug-rs = { path = "../debug-rs", default-features = false }
counts-rs = { path = "../counts-rs", default-features = false }
picker-rs = { path = "../picker-rs", default-features = false }

[workspace]
