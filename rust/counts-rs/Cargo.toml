[package]
name = "counts-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `internal/counts/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
registry-rs = { path = "../registry-rs", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tmux-rs = { path = "../tmux-rs", default-features = false }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[features]
default = ["ffi"]
ffi = []
